<!doctype html>
<!-- Source of the per-project link-preview cards in public/og/. One template,
     three versions picked by ?p=loan | fanhouse | photocull. Every figure here is
     copied from the project's own page; update both together. Regenerate with
     (from the nextjs-tailwindcss-portfolio folder), once per version:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=8000 --screenshot="$PWD/public/og/loan.png" "file://$PWD/design/og-project.html?p=loan" -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@600;700&display=block">
<style>
	:root {
		--paper: #f7f3ea; --ink: #161412; --muted: #5b544a; --up: #2b7a4b; --down: #c0262d;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
		padding: 26px 56px 24px; font-family: 'Source Serif 4', Georgia, serif;
	}
	.ear, .plate, .rainbow, .foot { flex: none; }
	.label { font: 700 14px/1.25 Inter, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
	.ear { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); }
	.ear b { color: var(--tone); }
	.plate {
		font-family: 'UnifrakturMaguntia', serif; font-size: 50px; line-height: 1;
		text-align: center; margin: 8px 0 10px; white-space: nowrap;
	}
	.rainbow {
		height: 5px;
		background: linear-gradient(90deg,
			#1a5aa6 0 14.28%, #0b7285 0 28.57%, #c0262d 0 42.85%,
			#6a3fa0 0 57.14%, #2b7a4b 0 71.42%, #b35300 0 85.71%, #a8326e 0);
	}
	/* The story fills the space between the rule and the footer, centred. */
	.main { flex: 1; display: grid; grid-template-columns: 1fr 390px; gap: 44px; align-items: center; padding: 18px 0; }
	.badge {
		display: inline-block; background: var(--tone); color: #fff; padding: 7px 11px 6px;
	}
	h1 {
		font-family: 'Playfair Display', Georgia, serif; font-weight: 900;
		font-size: var(--h1, 54px); line-height: 1.04; letter-spacing: -.01em; margin: 16px 0 14px;
	}
	.dek { font-size: 22px; line-height: 1.38; color: #2b2824; }
	.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 24px; border-top: 1px solid var(--ink); }
	.stat { padding: 12px 14px 0 0; }
	.stat + .stat { padding-left: 16px; border-left: 1px solid rgba(22,20,18,.25); }
	.fig { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 42px; line-height: 1; color: var(--tone); white-space: nowrap; }
	.stat .label { font-size: 12px; color: var(--muted); margin-top: 7px; }

	/* Right-hand visuals */
	.visual { align-self: center; }
	.frame {
		background: #fff; padding: 10px; border: 1px solid rgba(22,20,18,.2);
		box-shadow: 0 10px 24px rgba(22,20,18,.14); transform: rotate(1.5deg);
	}
	.frame img { display: block; width: 100%; height: 250px; object-fit: cover; object-position: 50% 40%; }
	.frame .label { font-size: 11px; color: var(--muted); margin-top: 9px; letter-spacing: .1em; }
	.box { border: 2px solid var(--ink); background: #fff; padding: 18px 20px; box-shadow: 6px 6px 0 var(--tone); }
	.box > .label { color: var(--tone); padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
	.est { display: grid; grid-template-columns: 1fr 1fr; }
	.est div { padding: 16px 4px 4px; text-align: center; }
	.est div + div { border-left: 1px solid rgba(22,20,18,.2); }
	.est .label { font-size: 12px; color: var(--muted); }
	.est .val { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 34px; margin: 10px 0 6px; white-space: nowrap; }
	.est .up { color: var(--up); } .est .down { color: var(--down); }
	.est small { font: 600 11px/1.2 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
	.note { font: 600 11px/1.3 Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(22,20,18,.2); }
	.steps { list-style: none; margin-top: 6px; }
	.steps li {
		display: flex; align-items: center; gap: 14px; padding: 13px 0;
		font-family: 'Playfair Display', serif; font-weight: 700; font-size: 25px;
	}
	.steps li + li { border-top: 1px dashed rgba(22,20,18,.3); }
	.steps span {
		display: grid; place-items: center; width: 34px; height: 34px; flex: none;
		background: var(--tone); color: #fff; font: 700 15px/1 Inter, sans-serif;
	}
	.foot {
		padding-top: 11px; border-top: 3px double var(--ink);
		display: flex; justify-content: space-between; color: var(--muted);
	}
	.foot b { color: var(--tone); }
</style>
</head>
<body>
	<div class="ear label"><span><b id="section"></b> · Case study</span><span>sreekaran-portfolio.vercel.app</span></div>
	<div class="plate">The Sreekaran Reddy Portfolio</div>
	<div class="rainbow"></div>
	<div class="main">
		<div>
			<span class="badge label" id="kicker"></span>
			<h1 id="headline"></h1>
			<p class="dek" id="dek"></p>
			<div class="stats" id="stats"></div>
		</div>
		<div class="visual" id="visual"></div>
	</div>
	<div class="foot label"><span>By Sreekaran Reddy · Data Analyst &amp; Data Scientist</span><b id="cta"></b></div>

<script>
const projects = {
	loan: {
		tone: '#c0262d',
		section: 'Forecasting',
		kicker: 'Time-series forecasting',
		headline: 'The Forecast That Was Too Good To Be True',
		dek: 'Once a data leak was fixed, ARIMA beat XGBoost and LightGBM on every one of five U.S. loan-delinquency series.',
		stats: [['5/5', 'Series won by ARIMA'], ['3', 'Models compared'], ['1991–2026', 'Quarterly data']],
		visual: `<figure class="frame"><img src="../public/images/loan-forecast-1.jpg" alt="">
			<figcaption class="label">All five series, 1991–2026 · recessions shaded</figcaption></figure>`,
		cta: 'Read the story →',
	},
	fanhouse: {
		tone: '#0b7285',
		h1: '46px',
		section: 'Causal inference',
		kicker: 'Causal inference · Synthetic data',
		headline: 'People bought more product value. Did the business keep more money?',
		dek: 'Eventual members were already spending 40.6% more before the membership existed.',
		stats: [['40,000', 'Synthetic customers'], ['12,153', 'Matched pairs'], ['40.6%', 'Gap before launch']],
		visual: `<div class="box"><p class="label">What the matched comparison showed</p>
			<div class="est">
				<div><p class="label">Product value</p><p class="val up">+$0.1367</p><small>Before discounts</small></div>
				<div><p class="label">Net payments</p><p class="val down">−$0.0103</p><small>After discounts &amp; coins</small></div>
			</div>
			<p class="note">Per customer / day · Matched DiD</p></div>`,
		cta: 'Read the case study →',
	},
	photocull: {
		tone: '#1a5aa6',
		section: 'Computer vision',
		kicker: 'Computer vision',
		headline: 'PhotoCull: Privacy-First Camera Roll Intelligence',
		dek: 'Finds near-duplicate photos, groups events and builds explainable shortlists, without paid inference APIs.',
		stats: [['82.76%', 'Near-duplicate F1'], ['98.36%', 'Precision'], ['71.43%', 'Recall']],
		visual: `<div class="box"><p class="label">How it works · photos stay local</p>
			<ol class="steps"><li><span>1</span>Scan + hash</li><li><span>2</span>Group + rank</li><li><span>3</span>Shortlist</li></ol>
			<p class="note">F1 on a synthetic held-out benchmark</p></div>`,
		cta: 'Read the project →',
	},
};
const p = projects[new URLSearchParams(location.search).get('p')] || projects.loan;
document.documentElement.style.setProperty('--tone', p.tone);
if (p.h1) document.documentElement.style.setProperty('--h1', p.h1);
for (const key of ['section', 'kicker', 'headline', 'dek', 'cta']) document.getElementById(key).textContent = p[key];
document.getElementById('stats').innerHTML = p.stats
	.map(([fig, label]) => `<div class="stat"><div class="fig">${fig}</div><div class="label">${label}</div></div>`).join('');
document.getElementById('visual').innerHTML = p.visual;
</script>
</body>
</html>
