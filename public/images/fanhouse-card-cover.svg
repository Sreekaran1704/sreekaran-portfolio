<title id="title">FanHouse: more product value, but more payments?</title>
<desc id="desc">Synthetic membership study. Matched pre-discount product value increased by an estimated 0.1367 dollars per customer per day. Net payments estimate: minus 0.0103 dollars, with a 95 percent interval from minus 0.0232 to plus 0.0027. Profit is not estimated.</desc>
